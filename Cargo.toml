[package]
name = "pando"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
